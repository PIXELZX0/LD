<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Love Design — Your Love Our Design</title>
<meta name="description" content="Love Design — Your Love Our Design.">
<meta name="theme-color" content="#0d0d0f">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♥</text></svg>">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    background: radial-gradient(120% 120% at 50% 0%, #1b1b22 0%, #0d0d0f 55%, #08080a 100%);
    color: #f4f1ec;
    font-family: "Helvetica Neue", Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 24px;
  }
  main { text-align: center; max-width: 900px; }
  .mark {
    margin: 0;
    font-size: clamp(2.4rem, 10vw, 6.2rem);
    font-weight: 300;
    line-height: 1.05;
    letter-spacing: .06em;
    white-space: nowrap;
  }
  .mark em { font-style: normal; color: #e0787f; }
  .rule {
    width: 56px; height: 1px; margin: 26px auto 22px;
    background: linear-gradient(90deg, transparent, #6f6a66, transparent);
  }
  .tag {
    margin: 0;
    font-size: clamp(.66rem, 2.1vw, .82rem);
    letter-spacing: .26em;
    color: #9d968e;
  }
  footer {
    position: fixed; left: 0; right: 0; bottom: 20px;
    text-align: center; font-size: .72rem; letter-spacing: .12em;
    color: #524d47;
  }
  @media (prefers-reduced-motion: no-preference) {
    main { animation: rise .9s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  }
</style>
</head>
<body>
  <main>
    <h1 class="mark">Love <em>D</em>esign</h1>
    <div class="rule"></div>
    <p class="tag">Your Love Our Design</p>
  </main>
  <footer>yourloveour.design</footer>
</body>
</html>
