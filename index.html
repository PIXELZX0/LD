<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LD — Love Design · Your Love Our Design</title>
<meta name="description" content="Love Design — 사랑을 당신에 맞게 조각해드립니다. 모든 분야의 고민상담, 곧 문을 엽니다.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♡</text></svg>">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --ink: #161616;
    --muted: #7a7470;
    --soft: #b9b2ad;
    --rose: #e14b62;
    --rose-soft: #f6d6db;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    min-height: 100svh;
    background: var(--bg);
    color: var(--ink);
    font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 64px 28px;
    overflow: hidden;
  }

  /* 테두리를 도는 LD ♡ 루프 */
  .frame {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
  .frame text {
    font-weight: 800;
    font-size: 14px;
    letter-spacing: .06em;
    fill: var(--ink);
  }
  .frame .h { fill: var(--ink); }
  .frame .track { fill: none; stroke: none; }

  main { text-align: center; max-width: 720px; position: relative; }

  .ld {
    margin: 0;
    font-weight: 900;
    font-size: clamp(6rem, 30vw, 13rem);
    line-height: .9;
    letter-spacing: -.06em;
    position: relative;
    display: inline-block;
  }
  .ld .heart {
    position: absolute;
    top: .02em; right: -.28em;
    font-size: .26em;
    font-weight: 400;
    color: var(--ink);
  }

  .name {
    margin: 18px 0 0;
    font-weight: 600;
    font-size: clamp(1.2rem, 4.4vw, 1.75rem);
    letter-spacing: .04em;
  }
  .name b { color: var(--rose); font-weight: 800; }

  .tag {
    margin: 8px 0 0;
    font-size: clamp(.68rem, 2.2vw, .82rem);
    letter-spacing: .32em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .rule {
    width: 48px; height: 1px; margin: 30px auto;
    background: linear-gradient(90deg, transparent, var(--rose), transparent);
  }

  .copy {
    margin: 0;
    font-size: clamp(1.05rem, 4vw, 1.45rem);
    font-weight: 400;
    letter-spacing: -.01em;
    line-height: 1.6;
    word-break: keep-all;
  }
  .copy em { font-style: normal; color: var(--rose); font-weight: 500; }

  .soon {
    display: inline-flex; align-items: center; gap: 10px;
    margin-top: 28px;
    padding: 9px 18px;
    border: 1px solid var(--rose-soft);
    border-radius: 999px;
    font-size: .82rem;
    color: var(--muted);
    word-break: keep-all;
  }
  .soon i {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--rose);
    flex: none;
  }

  footer {
    position: fixed; left: 0; right: 0; bottom: 46px;
    text-align: center; font-size: .72rem; letter-spacing: .14em;
    color: var(--soft);
  }

  @media (prefers-reduced-motion: no-preference) {
    main { animation: rise 1s cubic-bezier(.2,.7,.2,1) both; }
    .ld .heart { animation: beat 1.6s ease-in-out infinite; transform-origin: center; display: inline-block; }
    .soon i { animation: pulse 1.8s ease-in-out infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes beat { 0%, 60%, 100% { transform: scale(1); } 15% { transform: scale(1.22); } 30% { transform: scale(.96); } 45% { transform: scale(1.12); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
  }

  @media (max-width: 480px) {
    .frame text { font-size: 12px; }
    footer { bottom: 38px; }
  }

  /* 마우스 반응 */
  .glow {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 50%), rgba(225, 75, 98, .08), transparent 70%);
    transition: opacity .6s;
  }
  main { z-index: 1; }
  .stage { perspective: 800px; }
  .ld {
    transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
    text-shadow: var(--sx, 0px) var(--sy, 0px) 0 var(--rose-soft);
    will-change: transform;
    cursor: default;
  }
  .spark {
    position: fixed; left: 0; top: 0; z-index: 2;
    pointer-events: none; user-select: none;
    color: var(--ink);
    font-size: var(--s, 14px);
    line-height: 1;
    animation: float var(--d, .9s) ease-out forwards;
  }
  @keyframes float {
    from { opacity: .9; transform: translate(-50%, -50%) translate(0, 0) scale(1) rotate(0deg); }
    to   { opacity: 0;  transform: translate(-50%, -50%) translate(var(--tx, 0px), var(--ty, -40px)) scale(.4) rotate(var(--rot, 0deg)); }
  }
</style>
</head>
<body>
  <svg class="frame" aria-hidden="true">
    <path id="loop" class="track" />
    <text><textPath id="ring" href="#loop"></textPath></text>
  </svg>

  <div class="glow" aria-hidden="true"></div>
  <main>
    <div class="stage"><h1 class="ld">LD<span class="heart" aria-hidden="true">♡</span></h1></div>
    <p class="name"><b>L</b>ove <b>D</b>esign</p>
    <p class="tag">Your Love Our Design</p>
    <div class="rule"></div>
    <p class="copy">사랑을 <em>당신에 맞게</em> 조각해드립니다</p>
    <div class="soon"><i></i>모든 분야의 고민상담, 지금 준비하고 있어요</div>
  </main>
  <footer>yourloveour.design</footer>

<script>
(function () {
  var svg = document.querySelector('.frame');
  var path = document.getElementById('loop');
  var ring = document.getElementById('ring');
  var UNIT = 'LD ♡ ';
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var per = 0, unitLen = 0, offset = 0, last = 0;
  var SPEED = 40; // px per second
  var boost = 0;  // 마우스를 빠르게 움직이면 테두리가 잠깐 빨라진다
  window.__ldBoost = function (v) { boost = Math.min(600, boost + v); };

  function build() {
    var w = window.innerWidth, h = window.innerHeight;
    var m = w < 480 ? 16 : 22;     // 화면 가장자리와의 간격
    var r = w < 480 ? 18 : 28;     // 모서리 둥글기
    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    var x0 = m, y0 = m, x1 = w - m, y1 = h - m;
    path.setAttribute('d',
      'M' + (x0 + r) + ' ' + y0 +
      ' H' + (x1 - r) + ' A' + r + ' ' + r + ' 0 0 1 ' + x1 + ' ' + (y0 + r) +
      ' V' + (y1 - r) + ' A' + r + ' ' + r + ' 0 0 1 ' + (x1 - r) + ' ' + y1 +
      ' H' + (x0 + r) + ' A' + r + ' ' + r + ' 0 0 1 ' + x0 + ' ' + (y1 - r) +
      ' V' + (y0 + r) + ' A' + r + ' ' + r + ' 0 0 1 ' + (x0 + r) + ' ' + y0 + ' Z');
    per = path.getTotalLength();

    // 한 단위(LD ♡) 길이를 재고, 둘레에 정수 개가 딱 맞도록 간격을 조정한다
    ring.textContent = '';
    appendUnit();
    var natural = ring.getComputedTextLength() || 60;
    var n = Math.max(4, Math.round(per / natural));
    unitLen = per / n;
    ring.textContent = '';
    for (var i = 0; i < n + 1; i++) appendUnit();
    ring.setAttribute('textLength', unitLen * (n + 1));
    ring.setAttribute('lengthAdjust', 'spacing');
    // 글자를 선 바로 바깥쪽이 아닌 가운데에 오게
    ring.setAttribute('dy', '0.35em');
    offset = offset % unitLen;
    paint();
  }

  function appendUnit() {
    var ns = 'http://www.w3.org/2000/svg';
    var a = document.createElementNS(ns, 'tspan'); a.textContent = 'LD ';
    var b = document.createElementNS(ns, 'tspan'); b.textContent = '♡ '; b.setAttribute('class', 'h');
    ring.appendChild(a); ring.appendChild(b);
  }

  function paint() {
    ring.setAttribute('startOffset', (offset - unitLen).toFixed(2));
  }

  function tick(t) {
    if (last) {
      offset = (offset + (SPEED + boost) * (t - last) / 1000) % unitLen;
      boost *= 0.94;
      paint();
    }
    last = t;
    requestAnimationFrame(tick);
  }

  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(build, 80);
  });

  function start() {
    build();
    if (!reduce) requestAnimationFrame(tick);
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(start); else start();
})();
</script>

<script>
// 마우스 반응: 배경 하이라이트, 로고 기울기, 하트 꼬리, 클릭 하트 터짐
(function () {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var root = document.documentElement;
  var ld = document.querySelector('.ld');
  var finePointer = window.matchMedia('(pointer: fine)').matches;
  var tx = 0, ty = 0, cx = 0, cy = 0;   // 목표값 / 현재값 (-1 ~ 1)
  var lastX = null, lastY = null, lastSpark = 0;

  function spark(x, y, opts) {
    var el = document.createElement('span');
    el.className = 'spark';
    el.textContent = '♡';
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.setProperty('--s', opts.size + 'px');
    el.style.setProperty('--tx', opts.tx + 'px');
    el.style.setProperty('--ty', opts.ty + 'px');
    el.style.setProperty('--rot', opts.rot + 'deg');
    el.style.setProperty('--d', opts.dur + 's');
    document.body.appendChild(el);
    el.addEventListener('animationend', function () { el.remove(); });
  }

  window.addEventListener('pointermove', function (e) {
    var w = window.innerWidth, h = window.innerHeight;
    root.style.setProperty('--mx', e.clientX + 'px');
    root.style.setProperty('--my', e.clientY + 'px');
    tx = (e.clientX / w) * 2 - 1;
    ty = (e.clientY / h) * 2 - 1;

    if (lastX !== null) {
      var dist = Math.hypot(e.clientX - lastX, e.clientY - lastY);
      if (window.__ldBoost) window.__ldBoost(dist * 1.2);
      var now = performance.now();
      if (finePointer && e.pointerType === 'mouse' && dist > 2 && now - lastSpark > 45) {
        lastSpark = now;
        spark(e.clientX, e.clientY, {
          size: 8 + Math.random() * 8,
          tx: (Math.random() - .5) * 30,
          ty: -20 - Math.random() * 30,
          rot: (Math.random() - .5) * 60,
          dur: .7 + Math.random() * .4
        });
      }
    }
    lastX = e.clientX; lastY = e.clientY;
  }, { passive: true });

  document.addEventListener('pointerleave', function () { tx = 0; ty = 0; lastX = null; });

  window.addEventListener('pointerdown', function (e) {
    var n = 14;
    for (var i = 0; i < n; i++) {
      var a = (Math.PI * 2 * i) / n + Math.random() * .4;
      var r = 50 + Math.random() * 60;
      spark(e.clientX, e.clientY, {
        size: 10 + Math.random() * 14,
        tx: Math.cos(a) * r,
        ty: Math.sin(a) * r,
        rot: (Math.random() - .5) * 120,
        dur: .8 + Math.random() * .5
      });
    }
    if (window.__ldBoost) window.__ldBoost(400);
  });

  (function loop() {
    cx += (tx - cx) * .08;
    cy += (ty - cy) * .08;
    ld.style.setProperty('--ry', (cx * 14).toFixed(2) + 'deg');
    ld.style.setProperty('--rx', (-cy * 14).toFixed(2) + 'deg');
    ld.style.setProperty('--sx', (-cx * 10).toFixed(1) + 'px');
    ld.style.setProperty('--sy', (-cy * 10).toFixed(1) + 'px');
    requestAnimationFrame(loop);
  })();
})();
</script>
</body>
</html>
