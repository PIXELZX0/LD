<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>상담자 · Love Design</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/style.css">
<script src="/app.js"></script>
</head>
<body>
<main class="wrap">
  <div class="page-head">
    <span class="eyebrow">COUNSELOR</span>
    <h1>상담자</h1>
    <p class="sub">수락하면 바로 1:1 채팅이 시작돼요. 새 요청은 자동으로 나타나요.</p>
  </div>
  <section>
    <h2>대기 중인 상담 <span class="count" id="qn">0</span></h2>
    <div class="list" id="queue"></div>
  </section>
  <section>
    <h2>내가 맡은 상담 <span class="count" id="mn">0</span></h2>
    <div class="list" id="mine"></div>
  </section>
</main>
<script src="/socket.io/socket.io.js"></script>
<script>
let me;
async function load() {
  const [w, m] = await Promise.all([api('/api/consultations/waiting'), api('/api/consultations/mine')]);
  queue.replaceChildren(...(w.length ? w.map((c) => el('div', { class: 'card' },
    el('div', { class: 'row' }, el('b', {}, c.title), statusTag(c.status)),
    el('div', { class: 'muted' }, `${c.category} · ${c.client_name} · ${fmt(c.created_at)}`),
    el('div', { class: 'actions' }, el('a', { class: 'btn sm', href: '/chat?id=' + c.id }, '내용 보기'),
      c.client_id === me.id ? null : el('button', { class: 'btn sm primary', onclick: async () => {
        try { await api(`/api/consultations/${c.id}/accept`, {}); location.href = '/chat?id=' + c.id; }
        catch (x) { alert(x.message); load(); }
      } }, '수락')))) : [el('p', { class: 'empty' }, '대기 중인 상담이 없어요.')]));
  const mineRows = m.filter((c) => c.counselor_id === me.id);
  qn.textContent = w.length; mn.textContent = mineRows.length;
  mine.replaceChildren(...(mineRows.length ? mineRows.map((c) => el('a', { class: 'card', href: '/chat?id=' + c.id },
    el('div', { class: 'row' }, el('b', {}, c.title), statusTag(c.status)),
    el('div', { class: 'muted' }, `${c.category} · ${c.client_name} · ${fmt(c.created_at)}`))) : [el('p', { class: 'empty' }, '맡은 상담이 없어요.')]));
}
boot(['counselor', 'admin']).then(({ user }) => { me = user; load(); io().on('queue', load); });
</script>
</body>
</html>
