<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상담자 · Love Design</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♡</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/style.css">
<script src="/app.js"></script>
</head>
<body>
<main class="wrap">
  <h1>대기 중인 상담</h1>
  <p class="sub">수락하면 바로 1:1 채팅이 시작돼요. 새 요청은 자동으로 나타나요.</p>
  <div class="list" id="queue"></div>
  <h2>내가 맡은 상담</h2>
  <div class="list" id="mine"></div>
</main>
<script src="/socket.io/socket.io.js"></script>
<script>
let me;
async function load() {
  const [w, m] = await Promise.all([api('/api/consultations/waiting'), api('/api/consultations/mine')]);
  queue.replaceChildren(...(w.length ? w.map((c) => el('div', { class: 'card' },
    el('div', { class: 'row' }, el('b', {}, c.title), statusTag(c.status)),
    el('div', { class: 'muted' }, `${c.category} · ${c.client_name} · ${fmt(c.created_at)}`),
    el('p', {}, el('a', { class: 'btn sm', href: '/chat?id=' + c.id }, '내용 보기'), ' ',
      c.client_id === me.id ? null : el('button', { class: 'btn sm primary', onclick: async () => {
        try { await api(`/api/consultations/${c.id}/accept`, {}); location.href = '/chat?id=' + c.id; }
        catch (x) { alert(x.message); load(); }
      } }, '수락')))) : [el('p', { class: 'muted' }, '대기 중인 상담이 없어요.')]));
  const mineRows = m.filter((c) => c.counselor_id === me.id);
  mine.replaceChildren(...(mineRows.length ? mineRows.map((c) => el('a', { class: 'card', href: '/chat?id=' + c.id },
    el('div', { class: 'row' }, el('b', {}, c.title), statusTag(c.status)),
    el('div', { class: 'muted' }, `${c.category} · ${c.client_name} · ${fmt(c.created_at)}`))) : [el('p', { class: 'muted' }, '없어요.')]));
}
boot(['counselor', 'admin']).then(({ user }) => { me = user; load(); io().on('queue', load); });
</script>
</body>
</html>
