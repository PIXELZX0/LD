<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LD — Love Design · Your Love Our Design</title>
<meta name="description" content="Love Design — 당신에게 맞는 사랑을 조각해드립니다. 모든 분야의 고민상담.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♡</text></svg>">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script>document.documentElement.classList.add('auth-wait');</script>
<script src="/app.js"></script>
<style>
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --ink: #161616;
    --muted: #7a7470;
    --soft: #b9b2ad;
    --rose: #e14b62;
    --rose-soft: #f6d6db;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    min-height: 100svh;
    background: var(--bg);
    color: var(--ink);
    font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 64px 28px;
    overflow-x: hidden;
  }

  main { text-align: center; max-width: 720px; position: relative; }

  .ld {
    margin: 0;
    font-weight: 900;
    font-size: clamp(6rem, 30vw, 13rem);
    line-height: .9;
    letter-spacing: -.06em;
    position: relative;
    display: inline-block;
  }
  .ld .heart {
    position: absolute;
    top: .02em; right: -.28em;
    font-size: .26em;
    font-weight: 400;
    color: var(--ink);
  }

  .name {
    margin: 18px 0 0;
    font-weight: 600;
    font-size: clamp(1.2rem, 4.4vw, 1.75rem);
    letter-spacing: .04em;
  }
  .name b { color: var(--rose); font-weight: 800; }

  .tag {
    margin: 8px 0 0;
    font-size: clamp(.68rem, 2.2vw, .82rem);
    letter-spacing: .32em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .rule {
    width: 48px; height: 1px; margin: 30px auto;
    background: linear-gradient(90deg, transparent, var(--rose), transparent);
  }

  .copy {
    margin: 0;
    font-size: clamp(1.05rem, 4vw, 1.45rem);
    font-weight: 400;
    letter-spacing: -.01em;
    line-height: 1.6;
    word-break: keep-all;
  }
  .copy em { font-style: normal; color: var(--rose); font-weight: 500; }


  .menu {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    max-width: 420px; margin: 30px auto 0;
  }
  .btn {
    display: block; padding: 13px 10px;
    border: 1px solid var(--rose-soft); border-radius: 999px;
    background: #fff; color: var(--ink);
    font: inherit; font-size: .9rem; font-weight: 500;
    text-decoration: none; cursor: pointer; word-break: keep-all;
    transition: border-color .2s, background .2s, transform .15s;
  }
  .btn:hover { border-color: var(--rose); }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
  .btn.primary:hover { background: var(--rose); border-color: var(--rose); }
  .btn:focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; }
  .hint { margin: 18px 0 0; font-size: .84rem; color: var(--muted); }
  .hint a { color: var(--ink); text-underline-offset: 3px; text-decoration-color: var(--rose-soft); }
  .hint a:hover { color: var(--rose); text-decoration-color: var(--rose); }

  .topnav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 3;
    display: flex; justify-content: flex-end;
    padding: 18px 24px;
  }
  .topnav nav { display: flex; gap: 4px; font-size: .88rem; }
  .topnav a {
    color: var(--muted); text-decoration: none;
    padding: 10px 12px; border-radius: 10px;
    transition: color .2s, background .2s;
  }
  .topnav a:hover { color: var(--ink); background: #faf7f5; }
  .topnav a:focus-visible, .hint a:focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; }

  /* 로그인 상태 — 확인하는 동안에는 로그아웃 상태가 잠깐 비치지 않게 숨긴다 */
  .auth-wait .topnav nav, .auth-wait .menu, .auth-wait .hint { visibility: hidden; }
  .topnav nav { align-items: center; }
  .topnav a.who-chip {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--ink); font-weight: 500; padding: 6px 12px 6px 6px; border-radius: 999px;
    border: 1px solid var(--rose-soft); margin-right: 4px; max-width: 220px;
  }
  .topnav a.who-chip:hover { border-color: var(--rose); background: #fff; }
  .who-chip > span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .avatar {
    --size: 28px; width: var(--size); height: var(--size); flex: none;
    display: inline-grid; place-items: center; border-radius: 50%; overflow: hidden;
    object-fit: cover; background: var(--rose-soft); color: #b8283f;
    font-size: calc(var(--size) * .42); font-weight: 700; line-height: 1; user-select: none;
  }
  img.avatar { background: #faf7f5; box-shadow: inset 0 0 0 1px rgba(22, 22, 22, .06); }
  .hint b { color: var(--ink); font-weight: 600; }
  .linkish { font: inherit; color: var(--ink); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--rose-soft); }
  .linkish:hover { color: var(--rose); text-decoration-color: var(--rose); }
  @media (max-width: 480px) {
    .topnav { padding: 12px 12px; }
    .topnav nav { font-size: .84rem; gap: 0; }
    .topnav a { padding: 8px 9px; }
    .topnav a.who-chip { max-width: 150px; }
  }

  footer {
    position: fixed; left: 0; right: 0; bottom: 46px;
    text-align: center; font-size: .72rem; letter-spacing: .14em;
    color: var(--soft);
  }

  @media (prefers-reduced-motion: no-preference) {
    main { animation: rise 1s cubic-bezier(.2,.7,.2,1) both; }
    .ld .heart { animation: beat 1.6s ease-in-out infinite; transform-origin: center; display: inline-block; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes beat { 0%, 60%, 100% { transform: scale(1); } 15% { transform: scale(1.22); } 30% { transform: scale(.96); } 45% { transform: scale(1.12); } }
  }

  @media (max-width: 480px) {
    footer { bottom: 38px; }
  }

  /* 마우스 반응 */
  /* 화면 전체를 다시 그리지 않도록 원 하나를 transform 으로만 옮긴다 */
  .glow {
    position: fixed; left: 0; top: 0; z-index: 0;
    width: 840px; height: 840px; margin: -420px 0 0 -420px;
    pointer-events: none; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(225, 75, 98, .08), transparent 70%);
    transform: translate3d(50vw, 50vh, 0);
    will-change: transform;
  }
  main { z-index: 1; }
  .stage { perspective: 800px; }
  .ld {
    transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
    text-shadow: var(--sx, 0px) var(--sy, 0px) 0 var(--rose-soft);
    will-change: transform;
    cursor: default;
  }
  .spark {
    position: fixed; left: 0; top: 0; z-index: 2;
    pointer-events: none; user-select: none;
    color: var(--ink);
    font-size: var(--s, 14px);
    line-height: 1;
    animation: float var(--d, .9s) ease-out forwards;
  }
  @keyframes float {
    from { opacity: .9; transform: translate(-50%, -50%) translate(0, 0) scale(1) rotate(0deg); }
    to   { opacity: 0;  transform: translate(-50%, -50%) translate(var(--tx, 0px), var(--ty, -40px)) scale(.4) rotate(var(--rot, 0deg)); }
  }
</style>
</head>
<body>
  <header class="topnav">
    <nav aria-label="사이트 안내" id="topLinks">
      <a href="/guide">이용방법</a>
      <a href="/about">소개</a>
      <a href="/login">로그인</a>
    </nav>
  </header>

  <div class="glow" aria-hidden="true"></div>
  <main>
    <div class="stage"><h1 class="ld">LD<span class="heart" aria-hidden="true">♡</span></h1></div>
    <p class="name"><b>L</b>ove <b>D</b>esign</p>
    <p class="tag">Your Love Our Design</p>
    <div class="rule"></div>
    <p class="copy"><em>당신에게 맞는</em> 사랑을 조각해드립니다</p>
    <nav class="menu" id="menu">
      <button type="button" class="btn primary" id="anon">익명으로 이용하기</button>
      <a class="btn primary" href="/login">회원으로 이용하기</a>
    </nav>
    <p class="hint" id="hint">처음이라면 <a href="/guide">이용방법</a>부터 살펴보세요</p>
  </main>
  <footer>yourloveour.design</footer>

<script>
document.getElementById('anon').addEventListener('click', async function () {
  this.disabled = true;
  var r = await fetch('/api/anon', { method: 'POST' });
  if (r.ok) location.href = '/new'; else { this.disabled = false; alert('잠시 후 다시 시도해주세요.'); }
});

// 로그인돼 있으면 상단 메뉴·버튼을 내 계정 기준으로 바꾼다
(function () {
  var root = document.documentElement;
  var done = function () { root.classList.remove('auth-wait'); };
  setTimeout(done, 1500); // 응답이 늦어도 화면은 보여준다
  api('/api/me').then(function (r) {
    var user = r.user;
    if (!user) return;
    var staff = user.role === 'counselor' || user.role === 'admin';
    var logout = function (e) { e.preventDefault(); api('/api/logout', {}).then(function () { location.reload(); }); };
    var chip = el('a', { class: 'who-chip', href: '/account', title: '내 정보' }, avatar(user, 28), el('span', {}, whoName(user)));
    document.getElementById('topLinks').replaceChildren(chip,
      el('a', { href: '/my' }, '내 상담'),
      staff ? el('a', { href: '/counselor' }, '상담자') : null,
      el('a', { href: '#', onclick: logout }, '로그아웃'));
    document.getElementById('menu').replaceChildren(
      staff ? el('a', { class: 'btn primary', href: '/counselor' }, '상담 대기열 보기') : el('a', { class: 'btn primary', href: '/new' }, '새 상담 시작하기'),
      el('a', { class: 'btn', href: '/my' }, '내 상담 보기'));
    document.getElementById('hint').replaceChildren(...(user.is_anonymous
      ? [el('b', {}, user.nickname), '(으)로 익명 이용 중이에요 · ', el('a', { href: '/signup' }, '회원가입'), '하면 어디서든 기록을 볼 수 있어요']
      : [el('b', {}, user.nickname), '님으로 로그인돼 있어요 · ', el('button', { type: 'button', class: 'linkish', onclick: logout }, '로그아웃')]));
  }).catch(function () {}).finally(done);
})();
</script>

<script>
// 마우스 반응: 배경 하이라이트, 로고 기울기, 하트 꼬리, 클릭 하트 터짐
(function () {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var ld = document.querySelector('.ld');
  var finePointer = window.matchMedia('(pointer: fine)').matches;
  var tx = 0, ty = 0, cx = 0, cy = 0;   // 목표값 / 현재값 (-1 ~ 1)
  var lastX = null, lastY = null, lastSpark = 0;

  function spark(x, y, opts) {
    var el = document.createElement('span');
    el.className = 'spark';
    el.textContent = '♡';
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.setProperty('--s', opts.size + 'px');
    el.style.setProperty('--tx', opts.tx + 'px');
    el.style.setProperty('--ty', opts.ty + 'px');
    el.style.setProperty('--rot', opts.rot + 'deg');
    el.style.setProperty('--d', opts.dur + 's');
    document.body.appendChild(el);
    el.addEventListener('animationend', function () { el.remove(); });
  }

  var glow = document.querySelector('.glow');
  var mx = 0, my = 0, raf = 0, prev = 0;

  // 이벤트에서는 값만 저장하고, 화면 갱신은 프레임당 한 번만 한다
  function kick() { if (!raf) { prev = 0; raf = requestAnimationFrame(loop); } }

  window.addEventListener('pointermove', function (e) {
    var w = window.innerWidth, h = window.innerHeight;
    mx = e.clientX; my = e.clientY;
    tx = (mx / w) * 2 - 1;
    ty = (my / h) * 2 - 1;

    if (lastX !== null) {
      var dist = Math.hypot(mx - lastX, my - lastY);
      var now = performance.now();
      if (finePointer && e.pointerType === 'mouse' && dist > 2 && now - lastSpark > 30) {
        lastSpark = now;
        spark(mx, my, {
          size: 8 + Math.random() * 8,
          tx: (Math.random() - .5) * 30,
          ty: -20 - Math.random() * 30,
          rot: (Math.random() - .5) * 60,
          dur: .7 + Math.random() * .4
        });
      }
    }
    lastX = mx; lastY = my;
    kick();
  }, { passive: true });

  document.addEventListener('pointerleave', function () { tx = 0; ty = 0; lastX = null; kick(); });

  window.addEventListener('pointerdown', function (e) {
    var n = 14;
    for (var i = 0; i < n; i++) {
      var a = (Math.PI * 2 * i) / n + Math.random() * .4;
      var r = 50 + Math.random() * 60;
      spark(e.clientX, e.clientY, {
        size: 10 + Math.random() * 14,
        tx: Math.cos(a) * r,
        ty: Math.sin(a) * r,
        rot: (Math.random() - .5) * 120,
        dur: .8 + Math.random() * .5
      });
    }
  });

  function loop(t) {
    // 주사율과 무관하게 같은 속도로 따라오도록 프레임 간격으로 보정
    var k = prev ? 1 - Math.pow(1 - .22, (t - prev) / 16.67) : .22;
    prev = t;
    cx += (tx - cx) * k;
    cy += (ty - cy) * k;
    glow.style.transform = 'translate3d(' + mx + 'px,' + my + 'px,0)';
    ld.style.setProperty('--ry', (cx * 14).toFixed(2) + 'deg');
    ld.style.setProperty('--rx', (-cy * 14).toFixed(2) + 'deg');
    ld.style.setProperty('--sx', (-cx * 10).toFixed(1) + 'px');
    ld.style.setProperty('--sy', (-cy * 10).toFixed(1) + 'px');
    // 목표에 도달하면 멈춰서 가만히 있을 때 매 프레임 다시 그리지 않는다
    if (Math.abs(tx - cx) + Math.abs(ty - cy) > .001) raf = requestAnimationFrame(loop);
    else raf = 0;
  }
})();
</script>
</body>
</html>
