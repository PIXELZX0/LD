<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>새 상담 · Love Design</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/style.css">
<script src="/app.js"></script>
</head>
<body>
<main class="wrap read">
 <div class="panel">
  <div class="page-head">
    <span class="eyebrow">NEW</span>
    <h1>고민 남기기</h1>
    <p class="sub" id="sub">상담자가 수락하면 실시간 채팅이 시작돼요.</p>
  </div>
  <form id="f">
    <label>분야 <select name="category" id="cat"></select></label>
    <label>제목 <input name="title" maxlength="120" required></label>
    <label>고민 내용 <textarea name="body" maxlength="2000" required placeholder="편하게 적어주세요."></textarea></label>
    <p class="muted" id="consent" hidden>상담을 요청하면 <a href="/terms" target="_blank" rel="noopener">이용약관</a>과 <a href="/privacy" target="_blank" rel="noopener">개인정보처리방침</a>(민감정보 처리, 미국 서버로의 국외 이전 포함)에 동의한 것으로 봐요. 이름·연락처처럼 나를 알아볼 수 있는 정보는 적지 않는 걸 권해요.</p>
    <p class="err" id="err"></p>
    <button class="btn primary">상담 요청하기</button>
  </form>
 </div>
</main>
<script>
boot(true).then(({ user, categories }) => {
  cat.append(...categories.map((c) => el('option', {}, c)));
  consent.hidden = !user.is_anonymous;
  if (user.is_anonymous) sub.textContent = `${user.nickname}(으)로 익명 상담 중이에요. 이 브라우저를 벗어나면 기록을 다시 볼 수 없어요.`;
});
f.onsubmit = async (e) => {
  e.preventDefault();
  try { const { id } = await api('/api/consultations', Object.fromEntries(new FormData(f))); location.href = '/chat?id=' + id; }
  catch (x) { err.textContent = x.message; }
};
</script>
</body>
</html>
