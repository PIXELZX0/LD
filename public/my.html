<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>내 상담 · Love Design</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="Love Design">
<meta property="og:locale" content="ko_KR">
<meta property="og:title" content="내 상담 · Love Design">
<meta property="og:description" content="가입 없이 익명으로, 승인된 상담자와 1:1 실시간 채팅으로 나누는 고민상담 — Love Design">
<meta property="og:image" content="https://yourloveour.design/og.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="LD♡ Love Design — 익명 1:1 고민상담">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://yourloveour.design/og.png">
<meta name="theme-color" content="#e14b62">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/style.css">
<script src="/app.js"></script>
</head>
<body>
<main class="wrap">
  <div class="page-head row">
    <div><h1>내 상담</h1><p class="sub">진행 중이거나 지난 상담을 다시 볼 수 있어요.</p></div>
    <a class="btn primary" href="/new">새 상담 시작</a>
  </div>
  <div class="list" id="list"></div>
  <section id="apply" hidden>
    <h2>상담자 지원</h2>
    <div class="card">
    <p class="muted">다른 사람의 고민을 함께 들어주고 싶다면 지원해주세요. 관리자 승인 후 상담자로 활동할 수 있어요.</p>
    <div id="apps" class="muted" style="white-space:pre-line;margin-bottom:16px"></div>
    <form id="f">
      <label>자기소개 · 상담 경험 <textarea name="intro" minlength="10" maxlength="2000" required></textarea></label>
      <p class="err" id="err"></p>
      <button class="btn">지원서 제출</button>
    </form>
    </div>
  </section>
</main>
<script>
const APP = { pending: '심사중', approved: '승인됨', rejected: '거절됨' };
boot(true).then(async ({ user }) => {
  const rows = await api('/api/consultations/mine');
  list.replaceChildren(...(rows.length ? rows.map((c) => el('a', { class: 'card', href: '/chat?id=' + c.id },
    el('div', { class: 'row' }, el('b', {}, c.title), el('span', { class: 'tags' },
      c.client_id === user.id && c.status === 'closed' && c.counselor_id
        ? (c.rating ? stars(c.rating) : el('span', { class: 'tag ask' }, '후기 남기기')) : null,
      statusTag(c.status))),
    el('div', { class: 'muted' }, `${c.category} · ${fmt(c.created_at)} · ${c.client_id === user.id ? '상담자 ' + (c.counselor_name || '배정 전') : '내담자 ' + c.client_name}`)))
    : [el('p', { class: 'empty' }, '아직 상담이 없어요. ‘새 상담 시작’을 눌러 고민을 남겨보세요.')]));
  if (user.role === 'user' && !user.is_anonymous) {
    apply.hidden = false;
    const apps = await api('/api/apply');
    window.apps.textContent = apps.map((a) => `${fmt(a.created_at)} 지원 — ${APP[a.status]}`).join('\n');
    if (apps.some((a) => a.status === 'pending')) f.hidden = true;
  }
});
f.onsubmit = async (e) => {
  e.preventDefault();
  try { await api('/api/apply', Object.fromEntries(new FormData(f))); location.reload(); }
  catch (x) { err.textContent = x.message; }
};
</script>
</body>
</html>
