<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회원가입 · Love Design</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♡</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/style.css">
<script src="/app.js"></script>
</head>
<body>
<main class="wrap">
  <h1>회원가입</h1>
  <p class="sub">닉네임만 상담자에게 보여요.</p>
  <form id="f">
    <label>이메일
      <span class="inline">
        <input name="email" id="email" type="email" required autocomplete="email">
        <button type="button" class="btn" id="send">인증번호 받기</button>
      </span>
    </label>
    <label>인증번호 <input name="code" id="code" inputmode="numeric" pattern="\d{6}" maxlength="6" required autocomplete="one-time-code" placeholder="메일로 받은 6자리"></label>
    <p class="muted" id="info"></p>
    <label>비밀번호 (8자 이상) <input name="password" type="password" minlength="8" maxlength="72" required autocomplete="new-password"></label>
    <label>닉네임 <input name="nickname" maxlength="20" required></label>
    <p class="err" id="err"></p>
    <button class="btn primary">가입하기</button>
  </form>
  <p class="muted">이미 회원이신가요? <a href="/login">로그인</a></p>
</main>
<script>
boot();
let timer;
send.onclick = async () => {
  err.textContent = '';
  if (!email.reportValidity()) return;
  send.disabled = true;
  try {
    await api('/api/email/code', { email: email.value });
    info.textContent = `${email.value} 로 인증번호를 보냈어요. 10분 안에 입력해주세요. (스팸함도 확인해주세요)`;
    code.focus();
    let left = 60;
    clearInterval(timer);
    timer = setInterval(() => {
      send.textContent = --left > 0 ? `다시 받기 (${left})` : '다시 받기';
      if (left <= 0) { clearInterval(timer); send.disabled = false; }
    }, 1000);
  } catch (x) { err.textContent = x.message; send.disabled = false; }
};
f.onsubmit = async (e) => {
  e.preventDefault();
  try { await api('/api/signup', Object.fromEntries(new FormData(f))); location.href = '/my'; }
  catch (x) { err.textContent = x.message; }
};
</script>
</body>
</html>
