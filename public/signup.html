<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회원가입 · Love Design</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♡</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/style.css">
<script src="/app.js"></script>
</head>
<body>
<main class="wrap">
  <h1>회원가입</h1>
  <p class="sub">닉네임만 상담자에게 보여요.</p>
  <form id="f">
    <label>이메일 <input name="email" type="email" required autocomplete="email"></label>
    <label>비밀번호 (8자 이상) <input name="password" type="password" minlength="8" maxlength="72" required autocomplete="new-password"></label>
    <label>닉네임 <input name="nickname" maxlength="20" required></label>
    <p class="err" id="err"></p>
    <button class="btn primary">가입하기</button>
  </form>
  <p class="muted">이미 회원이신가요? <a href="/login">로그인</a></p>
</main>
<script>
boot();
f.onsubmit = async (e) => {
  e.preventDefault();
  try { await api('/api/signup', Object.fromEntries(new FormData(f))); location.href = '/my'; }
  catch (x) { err.textContent = x.message; }
};
</script>
</body>
</html>
