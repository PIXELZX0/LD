<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 · Love Design</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♡</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/style.css">
<script src="/app.js"></script>
</head>
<body>
<main class="wrap">
  <h1>회원으로 이용하기</h1>
  <p class="sub">로그인하면 상담 기록을 언제든 다시 볼 수 있어요.</p>
  <form id="f">
    <label>이메일 <input name="email" type="email" required autocomplete="email"></label>
    <label>비밀번호 <input name="password" type="password" required autocomplete="current-password"></label>
    <p class="err" id="err"></p>
    <button class="btn primary">로그인</button>
  </form>
  <p class="muted">처음이신가요? <a href="/signup">회원가입</a></p>
</main>
<script>
boot().then(({ user }) => { if (user && !user.is_anonymous) location.href = '/my'; });
f.onsubmit = async (e) => {
  e.preventDefault();
  try {
    await api('/api/login', Object.fromEntries(new FormData(f)));
    const next = new URLSearchParams(location.search).get('next');
    location.href = next && next.startsWith('/') && !next.startsWith('//') ? next : '/my';
  } catch (x) { err.textContent = x.message; }
};
</script>
</body>
</html>
